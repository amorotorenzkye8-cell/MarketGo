<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#064E3B">

<title>MarketGo</title>

<!-- Bootstrap 5 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<!-- MarketGo CSS -->
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- SPLASH -->
<div id="splash">
  <div class="spinner-border text-warning" role="status"></div>
  <h2 class="mt-3 text-white fw-bold"></h2>
  <p id="offlineMsg" class="text-white d-none mt-2">
    Please connect to the internet
    <button class="btn btn-warning btn-sm ms-2" onclick="location.reload()">
      Retry
    </button>
  </p>
</div>

<!-- HEADER -->
<header class="mg-header">
  <div class="top-bar">
    <div class="d-flex align-items-center">
      <i class="bi bi-bag-fill fs-4 me-2"></i>
      <span class="logo mb-0">MarketGo</span>
    </div>

    <a href="https://www.facebook.com/profile.php?id=61592434708876"
       target="_blank"
       class="btn btn-warning btn-sm fw-bold btn-ripple">
      Sell
    </a>
  </div>

  <div class="search-wrap">
    <input
      type="text"
      id="searchInput"
      class="form-control rounded-pill"
      placeholder="Search products...">
  </div>
</header>

<!-- MAIN CONTENT -->
<main id="app"></main>

<!-- BOTTOM NAV -->
<nav class="mg-bottom-nav">
  <button data-page="home">
    <i class="bi bi-house-door-fill fs-5"></i>
    <span>Home</span>
  </button>

  <button data-page="categories">
    <i class="bi bi-grid-3x3-gap-fill fs-5"></i>
    <span>Categories</span>
  </button>

  <button data-page="favorites">
    <i class="bi bi-heart-fill fs-5"></i>
    <span>Favorites</span>
  </button>

  <button data-page="sell">
    <i class="bi bi-plus-circle-fill fs-5"></i>
    <span>Sell</span>
  </button>

  <button data-page="profile">
    <i class="bi bi-person-fill fs-5"></i>
    <span>Profile</span>
  </button>
</nav>
<!-- MarketGo Data -->
<script src="products.js"></script>

<!-- MarketGo Functions -->
<script src="script.js"></script>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
